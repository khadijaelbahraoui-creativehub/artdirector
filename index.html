<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khadija El Bahraoui — Art Director & Graphic Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #0A0A0A;
    --cream-soft: #141414;
    --burgundy: #8F0A0A;
    --burgundy-deep: #650707;
    --ink: #F3ECDE;
    --bronze: #A9834A;
    --line: rgba(243,236,222,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Barlow', sans-serif;
    font-weight:300;
    line-height:1.6;
    overflow-x:hidden;
  }
  ::selection{background:var(--burgundy); color:var(--ink);}

  h1,h2,h3{font-family:'Cormorant Garamond', serif; font-weight:500; color:var(--ink); letter-spacing:0.01em;}

  .eyebrow{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.22em;
    font-size:0.72rem;
    color:var(--bronze);
    display:flex;
    align-items:center;
    gap:0.6em;
  }
  .eyebrow::before{
    content:"";
    width:22px; height:1px;
    background:var(--bronze);
    display:inline-block;
  }

  a{color:inherit;}

  /* ===== NAV ===== */
  nav{
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:1.4rem 5vw;
    background:rgba(10,10,10,0.86);
    backdrop-filter:blur(8px);
    border-bottom:1px solid transparent;
    transition:border-color .3s ease, padding .3s ease;
  }
  nav.scrolled{ border-bottom:1px solid var(--line); padding:0.9rem 5vw; }
  .nav-brand{ display:flex; align-items:center; gap:0.7rem; }
  .nav-brand svg{ display:block; }
  .nav-mark{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.35rem;
    letter-spacing:0.02em;
  }
  .nav-links{ display:flex; gap:2.2rem; list-style:none; }
  .nav-links a{
    font-family:'Barlow Condensed', sans-serif;
    font-size:0.82rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    text-decoration:none;
    position:relative;
    padding-bottom:4px;
  }
  .nav-links a::after{
    content:""; position:absolute; left:0; bottom:0; width:0; height:1px;
    background:var(--bronze); transition:width .25s ease;
  }
  .nav-links a:hover::after{ width:100%; }
  .nav-toggle{ display:none; }

  /* ===== HERO — TITLE CARD ===== */
  .hero{
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    position:relative;
    padding:6rem 6vw 4rem;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.35) 100%);
    pointer-events:none;
  }
  .hero-eye{ opacity:0; animation:fadeUp .9s ease forwards; animation-delay:0s; margin-bottom:0.6rem; }
  .hero-slug{
    font-family:'Barlow Condensed', sans-serif;
    letter-spacing:0.3em;
    font-size:0.72rem;
    text-transform:uppercase;
    color:var(--bronze);
    opacity:0;
    animation:fadeUp .9s ease forwards;
    animation-delay:.15s;
  }
  .hero h1{
    font-size:clamp(3rem, 9vw, 6.4rem);
    font-style:italic;
    line-height:1.02;
    margin:1.3rem 0 0.9rem;
    opacity:0;
    animation:fadeUp 1s ease forwards;
    animation-delay:.4s;
  }
  .hero-role{
    font-family:'Barlow Condensed', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.2em;
    font-size:clamp(0.85rem, 1.6vw, 1.05rem);
    color:var(--ink);
    opacity:0;
    animation:fadeUp 1s ease forwards;
    animation-delay:.7s;
  }
  .hero-role span{ color:var(--bronze); }
  .hero-sub{
    max-width:520px;
    margin-top:1.6rem;
    font-size:1.02rem;
    font-weight:300;
    color:rgba(243,236,222,0.75);
    opacity:0;
    animation:fadeUp 1s ease forwards;
    animation-delay:.95s;
  }
  .hero-locations{
    margin-top:2.4rem;
    font-family:'Barlow Condensed', sans-serif;
    letter-spacing:0.18em;
    font-size:0.78rem;
    text-transform:uppercase;
    color:var(--ink);
    opacity:0.65;
    display:flex; gap:0.8rem; align-items:center;
    opacity:0;
    animation:fadeUp 1s ease forwards;
    animation-delay:1.15s;
  }
  .hero-locations::before, .hero-locations::after{ content:"—"; opacity:0.5; }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .hero-eye, .hero-slug, .hero h1, .hero-role, .hero-sub, .hero-locations{ animation:none; opacity:1; }
  }

  .scroll-cue{
    position:absolute; bottom:2.4rem; left:50%; transform:translateX(-50%);
    width:1px; height:52px; background:var(--line);
    overflow:hidden;
  }
  .scroll-cue::after{
    content:""; position:absolute; top:-52px; left:0; width:1px; height:52px;
    background:var(--bronze);
    animation:cue 2.2s ease-in-out infinite;
  }
  @keyframes cue{ to{ top:100%; } }
